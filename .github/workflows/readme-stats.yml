name: 更新主页统计卡片

# 统计卡片在仓库里生成并提交，README 直接引用 profile/*.svg。
# 公共托管实例会因为配额或停服挂掉，自己生成就不受影响。
on:
  schedule:
    - cron: "0 1 * * *" # 每天 UTC 01:00（北京时间 09:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: 生成统计卡片
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=vue&locale=cn&line_height=20
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 生成常用语言卡片
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=vue&locale=cn
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 提交卡片
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: 更新主页统计卡片" || exit 0
          git push
